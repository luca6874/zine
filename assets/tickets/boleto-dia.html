
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleto diurno</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/boleto.css">
</head>

<body>

    <div class="ticket-red-wrapper">
        <div class="ticket-red">

            <div class="ticket-red-main">

                <!-- Ilustración de palomitas y refresco -->
                <svg class="popcorn-illustration"
                     viewBox="0 0 220 230"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M25 130 Q 100 110 185 75 L 205 135 Q 110 190 45 190 Z"
                          fill="#d64949" stroke="#5a1e1e" stroke-width="2.5"/>

                    <path d="M35 142 Q 105 122 178 90 L 192 128 Q 110 175 50 175 Z"
                          fill="#fdfbe6" stroke="#5a1e1e" stroke-width="2"/>

                    <path d="M52 90 C 42 80, 52 60, 68 62 C 72 45, 95 42, 105 55 C 118 45, 140 55, 138 72 C 150 78, 148 96, 132 100 Z"
                          fill="#f7e379" stroke="#4a3b10" stroke-width="2"/>

                    <circle cx="46" cy="56" r="8"
                            fill="#f7e379" stroke="#4a3b10" stroke-width="1.5"/>

                    <circle cx="152" cy="52" r="7"
                            fill="#f7e379" stroke="#4a3b10" stroke-width="1.5"/>

                    <polygon points="52,88 128,100 112,182 56,168"
                             fill="#e04f3e" stroke="#4a1914" stroke-width="2.5"/>

                    <line x1="70" y1="91" x2="68" y2="171"
                          stroke="#fdfbe6" stroke-width="3"/>

                    <line x1="90" y1="94" x2="84" y2="175"
                          stroke="#fdfbe6" stroke-width="3"/>

                    <line x1="110" y1="97" x2="100" y2="179"
                          stroke="#fdfbe6" stroke-width="3"/>

                    <text x="64" y="132"
                          font-family="Anton, sans-serif"
                          font-size="16"
                          fill="#fff"
                          stroke="#4a1914"
                          stroke-width="0.8"
                          transform="rotate(8 64 132)">POP</text>

                    <text x="62" y="148"
                          font-family="Anton, sans-serif"
                          font-size="16"
                          fill="#fff"
                          stroke="#4a1914"
                          stroke-width="0.8"
                          transform="rotate(8 62 148)">CORN</text>

                    <g transform="rotate(-12 150 140)">

                        <polyline points="145,95 145,55 172,52"
                                  fill="none"
                                  stroke="#4a1914"
                                  stroke-width="4"/>

                        <polyline points="145,95 145,55 172,52"
                                  fill="none"
                                  stroke="#fff"
                                  stroke-width="2"/>

                        <polygon points="118,100 176,100 168,195 126,195"
                                 fill="#d9483b"
                                 stroke="#4a1914"
                                 stroke-width="2.5"/>

                        <line x1="132" y1="105" x2="136" y2="190"
                              stroke="#f28d7d"
                              stroke-width="2"/>

                        <ellipse cx="147" cy="98" rx="33" ry="9"
                                 fill="#fff"
                                 stroke="#4a1914"
                                 stroke-width="2.5"/>

                        <ellipse cx="147" cy="95" rx="26" ry="5"
                                 fill="#eaeaea"
                                 stroke="#4a1914"
                                 stroke-width="1.5"/>
                    </g>

                </svg>

                <div class="ticket-red-content">

                    <h2 class="ticket-red-title">
                        BOLETO DE CINE
                    </h2>

                    <div class="red-info-card">

                        <div class="red-movie-title">
                            PELÍCULA: CIRCLE
                        </div>

                        <div class="red-details-grid">

                            <div class="red-detail-col">
                                02 DE<br>
                                SEPTIEMBRE<br>
                                19:00 HRS.
                            </div>

                            <div class="red-detail-col center-col">
                                SALA 29<br>
                                FILA 07<br>
                                ASIENTO 09
                            </div>

                            <div class="red-detail-col">
                                CINE<br>
                                Alex zine
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="ticket-red-stub">

                <div class="pase-badge">
                    <span>PASE</span>
                    <span>PERSONAL</span>
                </div>

                <div class="stub-red-movie">
                    “CIRCLE”
                </div>

                <div class="stub-red-bottom-card">

                    <div class="stub-red-bottom-left">
                        SALA 29<br>
                        FILA 07<br>
                        ASIENTO 09
                    </div>

                    <div class="stub-red-bottom-right">
                        COSTO:<br>
                        +5 MINUTITOS EN 4
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
