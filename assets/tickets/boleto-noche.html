
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleto nocturno</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/boleto.css">
</head>

<body>

    <div class="ticket-bw-wrapper">
        <div class="ticket-bw">

            <div class="ticket-bw-main">

                <div class="film-strip-deco">
                    <div class="film-holes"></div>
                    <div class="film-frames"></div>
                    <div class="film-holes"></div>
                </div>

                <!-- Proyector vintage -->
                <svg class="projector-illustration"
                     viewBox="0 0 240 220"
                     xmlns="http://www.w3.org/2000/svg">

                    <g transform="translate(85, 65)">
                        <circle cx="0" cy="0" r="46"
                                fill="#999" stroke="#222" stroke-width="3"/>
                        <circle cx="0" cy="0" r="39"
                                fill="#888" stroke="#333" stroke-width="1.5"/>

                        <ellipse cx="-16" cy="-14" rx="7" ry="12"
                                 fill="#fff" transform="rotate(15 -16 -14)"/>
                        <ellipse cx="16" cy="-14" rx="8" ry="13"
                                 fill="#fff" transform="rotate(-15 16 -14)"/>
                        <ellipse cx="-16" cy="16" rx="7" ry="12"
                                 fill="#fff" transform="rotate(-15 -16 16)"/>
                        <ellipse cx="16" cy="16" rx="8" ry="13"
                                 fill="#444" transform="rotate(15 16 16)"/>

                        <circle cx="0" cy="0" r="10"
                                fill="#666" stroke="#222" stroke-width="2"/>
                    </g>

                    <path d="M75 110 L175 95 L185 185 L85 200 Z"
                          fill="#777" stroke="#222" stroke-width="3"/>

                    <rect x="95" y="120" width="60" height="55"
                          fill="#666" stroke="#222" stroke-width="2"
                          transform="rotate(-8 95 120)"/>

                    <polygon points="175,112 205,105 212,148 180,152"
                             fill="#999" stroke="#222" stroke-width="2.5"/>

                    <polygon points="205,102 225,98 232,148 212,150"
                             fill="#333" stroke="#111" stroke-width="2"/>

                    <g transform="translate(52, 165) rotate(-12)">
                        <ellipse cx="0" cy="0" rx="34" ry="44"
                                 fill="#888" stroke="#222" stroke-width="3"/>

                        <ellipse cx="-10" cy="-16" rx="6" ry="10" fill="#fff"/>
                        <ellipse cx="10" cy="-14" rx="6" ry="10" fill="#555"/>
                        <ellipse cx="-10" cy="16" rx="6" ry="10" fill="#fff"/>
                        <ellipse cx="10" cy="14" rx="6" ry="10" fill="#555"/>

                        <circle cx="0" cy="0" r="8"
                                fill="#555" stroke="#222" stroke-width="2"/>
                    </g>
                </svg>

                <div class="ticket-bw-info">

                    <h1 class="ticket-bw-title">NOCHE DE CINE</h1>

                    <div class="seat-box-bw">
                        <div class="seat-col">
                            <span class="seat-label">FILA</span>
                            <span class="seat-value">A</span>
                        </div>

                        <div class="seat-col">
                            <span class="seat-label">ASIENTO</span>
                            <span class="seat-value">06</span>
                        </div>

                        <div class="seat-col">
                            <span class="seat-label">SALA</span>
                            <span class="seat-value">29</span>
                        </div>
                    </div>

                    <div class="movie-name-bw">
                        PELÍCULA: “BREAKER BREAKER”
                    </div>

                </div>
            </div>

            <div class="ticket-bw-stub">

                <div class="stub-bw-title">
                    ADMISIÓN PERSONAL
                </div>

                <div class="stub-bw-box">
                    <div class="stub-bw-row">FECHA: 23/09/2026</div>
                    <div class="stub-bw-row">HORA: 09:40 P.M.</div>
                    <div class="stub-bw-row">COSTO: +1 SALIDITA A LA PAH</div>
                </div>

                <div class="ticket-number-badge">
                    NO. 0123456789
                </div>

            </div>

        </div>
    </div>

</body>
</html>
